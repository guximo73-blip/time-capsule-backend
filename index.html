;">← 返回仪表盘</button></div><div id="dashboard-view" class="active view-fade-in"><div class="dashboard-grid" id="dashboardGrid"></div></div><div id="calendar-view"><div class="control-group"><div class="calendar-control"><button class="cal-btn" id="prevMonth">◀</button><span class="current-ym" id="ymDisplay">2026年7月</span><button class="cal-btn" id="nextMonth">▶</button><button id="addBtn" class="add-btn">➕ 添加物料</button></div><div class="search-area"><input id="searchDateInput" placeholder="搜索日期 如 2026-07-20"/><button id="importBtn">📥 导入</button><button id="importExcelBtn">📊 Excel</button></div></div><div style="display:flex;gap:16px;align-items:flex-start;margin-top:6px;"><div style="flex:1;min-width:0;overflow-x:auto;" id="calendar-area"></div><div class="side-panel" id="tagLegendPanel"><div class="side-panel-header"><span>🏷️ 行程</span><button class="toggle-btn" data-target="tagLegendPanel">▾</button></div><div class="side-panel-body" id="tagLegendBody"></div></div></div></div><div class="modal-mask" id="modalMask"><div class="modal-wrap"><div class="modal-img-box" id="modalMediaBox"><span class="no-media">暂无媒体</span></div><div class="modal-info"><div id="modalPersonTags" class="modal-person-tags" style="display:none;"></div><div class="modal-title" id="modalTitle"></div><div id="modalLinkList"></div><div style="margin:10px 0;display:flex;flex-wrap:wrap;gap:6px;" id="modalTagDisplay"></div><div class="modal-actions"><button class="modal-edit-btn" id="modalEditBtn">✏️ 编辑</button><button class="modal-delete-btn" id="modalDeleteBtn">🗑️ 删除</button></div></div><button class="modal-close" id="modalClose">×</button></div></div><div class="modal-mask form-modal" id="formModal"><div class="modal-wrap"><div class="modal-info"><div class="form-title" id="formTitle">📝 添加物料</div><form id="scheduleForm" autocomplete="off"><div class="form-row"><div class="form-group"><label>日期 <span class="required">*</span></label><input type="text" id="formDate" placeholder="YYYY-MM-DD 或 240529" required></div><div class="form-group"><label>状态</label><div style="display:flex;gap:16px;padding-top:6px;"><label><input type="radio" name="formStatus" value="已补完" checked> ✅ 已补完</label><label><input type="radio" name="formStatus" value="待补"> ⏳ 待补</label></div></div></div><div class="form-group" style="display:none;"><label>人物</label><div id="personCheckboxContainer" class="person-checkbox-group"></div></div><div class="form-group"><label>标题 <span class="required">*</span></label><input type="text" id="formTitleInput" placeholder="如：音乐银行 横版直拍" required></div><div class="form-group"><label>行程分类（可多选）</label><div id="formTagCheckboxContainer" class="person-checkbox-group" style="gap:6px;"></div></div><div class="form-group"><label>链接</label><input type="text" id="formLinks" placeholder="https://youtube.com/xxx 或 网盘链接"><div class="hint">支持图片/视频链接</div></div><div class="form-row"><div class="form-group"><label>缩略图</label><input type="text" id="formThumbnail" placeholder="图片URL"></div><div class="form-group"><label>视频嵌入</label><input type="text" id="formVideo" placeholder="YouTube / B站 链接"></div></div><div class="form-actions"><button type="button" class="btn-cancel" id="formCancel">取消</button><button type="submit" class="btn-submit" id="formSubmitBtn">✅ 保存</button></div></form></div><button class="modal-close" id="formClose">×</button></div></div><div class="ym-picker-overlay" id="ymPickerOverlay"><div class="ym-picker-box"><h3>📅 选择年月</h3><div class="ym-picker-row"><select id="ymYearSelect"></select><span>年</span><select id="ymMonthSelect"></select><span>月</span></div><div class="ym-picker-actions"><button class="ym-btn-confirm" id="ymConfirm">确认</button><button class="ym-btn-cancel" id="ymCancel">取消</button></div></div></div><div class="modal-mask import-modal" id="importModal"><div class="modal-wrap"><div class="modal-info"><div class="form-title">📥 批量导入日程</div><div style="margin-bottom:12px;color:#aaa;font-size:14px;line-height:1.7;">粘贴 JSON 数组数据，或上传 JSON 文件。<button id="loadSampleBtn" style="background:transparent;border:1px solid #555;color:#aaa;border-radius:4px;padding:2px 12px;cursor:pointer;font-size:13px;margin-left:8px;">📄 加载示例</button></div><div class="form-group"><label>JSON 数据</label><textarea id="importDataText" placeholder='[{"date":"2026-07-20","person":["Winter"],"title":"Winter 新物料"}]'></textarea></div><div class="import-toolbar"><span class="hint-text">📌 支持数组格式</span><button class="btn-outline" id="importFileBtn">📁 上传 JSON</button><button class="btn-primary" id="previewImportBtn">🔍 预览</button><input type="file" id="importFileInput" accept=".json,.txt"></div><div id="importPreviewArea" style="display:none;"><div class="import-stats-bar"><span class="stat-item">📊 共 <span class="num" id="importTotalCount">0</span> 条</span><span class="stat-item">✅ 有效 <span class="num green" id="importValidCount">0</span> 条</span><span class="stat-item">❌ 无效 <span class="num red" id="importInvalidCount">0</span> 条</span></div><div class="import-preview-table-wrap" id="importPreviewTableWrap"><table><thead><tr><th>#</th><th>日期</th><th>人物</th><th>标题</th><th>状态</th></tr></thead><tbody id="importPreviewBody"></tbody></table></div><div class="import-progress" id="importProgress"><span id="importProgressText">正在导入...</span><div class="progress-bar"><div class="fill" id="importProgressFill"></div></div></div><div class="form-actions"><button class="btn-cancel" id="importCancel">取消</button><button class="btn-submit" id="importConfirmBtn" style="background:#66BB6A;">📥 确认导入</button></div></div></div><button class="modal-close" id="importClose">×</button></div></div><div class="modal-mask" id="excelImportModal"><div class="modal-wrap" style="max-width:700px;flex-direction:column;padding:30px;"><div class="modal-info" style="width:100%;padding:0;"><div class="form-title">📊 Excel 导入日程</div><div style="margin-bottom:12px;color:#aaa;font-size:14px;line-height:1.7;">支持 .xlsx / .xls 格式。表头需包含：<code>date</code>、<code>person</code>、<code>title</code>。<a id="excelTemplateLink" href="#" style="color:#A8D8EA;text-decoration:underline;cursor:pointer;">📄 下载模板</a></div><div class="form-group"><label>选择 Excel 文件</label><input type="file" id="excelFileInput" accept=".xlsx,.xls" style="width:100%;padding:8px 12px;border:1px solid var(--border-color);border-radius:6px;background:rgba(0,0,0,.3);color:var(--text-color);font-size:14px;cursor:pointer;"></div><div id="excelPreviewArea" style="display:none;"><div class="import-stats-bar"><span class="stat-item">📊 共 <span class="num" id="excelTotalCount">0</span> 条</span><span class="stat-item">✅ 有效 <span class="num green" id="excelValidCount">0</span> 条</span><span class="stat-item">❌ 无效 <span class="num red" id="excelInvalidCount">0</span> 条</span></div><div class="import-preview-table-wrap" id="excelPreviewTableWrap"><table><thead><tr><th>#</th><th>日期</th><th>人物</th><th>标题</th><th>状态</th></tr></thead><tbody id="excelPreviewBody"></tbody></table></div><div class="form-actions"><button class="btn-cancel" id="excelImportCancel">取消</button><button class="btn-submit" id="excelConfirmBtn" style="background:#66BB6A;">📥 确认导入</button></div></div></div><button class="modal-close" id="excelImportClose">×</button></div></div><div class="import-result-toast" id="importResultToast"><span id="importResultMsg"></span><button class="toast-close" id="importToastClose">×</button></div><script>const API_BASE='https://time-capsule-backend-1-3mzs.onrender.com/api';const urlParams=new URLSearchParams(location.search);const isEditMode=urlParams.get('edit')==='true'||urlParams.get('key')==='20010101';if(!isEditMode)document.body.classList.add('readonly');document.addEventListener('DOMContentLoaded',function(){const s=document.getElementById('searchDateInput');if(s)s.placeholder=isEditMode?'搜索日程...':'筛选日程...';});const weekCN=["周日","周一","周二","周三","周四","周五","周六"];const personList=['Winter','aespa','Karina','Giselle','NingNing'];const displayPersonList=['Winter','aespa'];const personColorRule={"Winter":"#4FC3F7","aespa":"#66BB6A","Karina":"#FF6B9D","Giselle":"#B47EDC","NingNing":"#F9A95A"};const personDisplayMap={"Winter":"⭐Winter","aespa":"aespa","Karina":"💙Karina","Giselle":"🌙Giselle","NingNing":"🦋NingNing"};const MULTI_PERSON_COLOR="#F9A95A";const STORAGE_TAGS='winter_tags';const STORAGE_MILESTONES='winter_milestones';let scheduleList=[];async function loadScheduleData(){try{const resp=await fetch(API_BASE+'/data');if(!resp.ok)throw new Error('加载失败');let data=await resp.json();data=data.map(item=>{ensurePersonArray(item);ensureExtraFields(item);return item});scheduleList=data;renderAll();return scheduleList}catch(err){console.error('加载数据异常：',err);scheduleList=[];renderAll();return[]}}async function addSchedule(formData){if(!isEditMode)return null;try{const resp=await fetch(API_BASE+'/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(formData)});if(!resp.ok)throw new Error('添加失败');const newItem=await resp.json();ensurePersonArray(newItem);ensureExtraFields(newItem);scheduleList.push(newItem);renderAll();return newItem}catch(err){console.error('添加失败：',err);alert('添加失败，请检查后端是否启动');return null}}async function updateScheduleById(id,formData){if(!isEditMode)return null;try{const resp=await fetch(API_BASE+'/data/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(formData)});if(!resp.ok)throw new Error('更新失败');const updated=await resp.json();ensurePersonArray(updated);ensureExtraFields(updated);const idx=scheduleList.findIndex(item=>item.id===id);if(idx!==-1)scheduleList[idx]=updated;renderAll();return updated}catch(err){console.error('更新失败：',err);alert('更新失败');return null}}async function deleteScheduleById(id){if(!isEditMode)return;try{const resp=await fetch(API_BASE+'/data/'+id,{method:'DELETE'});if(!resp.ok)throw new Error('删除失败');scheduleList=scheduleList.filter(item=>item.id!==id);renderAll()}catch(err){console.error('删除失败：',err);alert('删除失败')}}function getScheduleById(id){return scheduleList.find(item=>item.id===id)}function getPersonColor(p){return personColorRule[p]||'#4FC3F7'}function getTextColorForPerson(p){return['Winter','aespa','Karina','NingNing'].includes(p)?'#000':'#fff'}function extractPersonKey(raw){if(!raw||typeof raw!=='string')return null;for(let name of personList){if(raw.includes(name))return name}return null}function ensurePersonArray(item){if(!item)return[];let persons=item.person;if(typeof persons==='string'){try{let parsed=JSON.parse(persons);persons=Array.isArray(parsed)?parsed:(typeof parsed==='object'?Object.values(parsed):[parsed])}catch{persons=persons.includes(',')?persons.split(',').map(s=>s.trim()):[persons.trim()]}}else if(!Array.isArray(persons))persons=[];persons=persons.map(p=>{if(typeof p==='string'){const key=extractPersonKey(p);return key||p}return p}).filter(p=>p&&typeof p==='string'&&p.trim()!=='').map(p=>p.trim());persons=persons.map(p=>personList.includes(p)?p:(extractPersonKey(p)||p));item.person=persons;return persons}function ensureExtraFields(item){if(!item.tags)item.tags=[];return item}function hexToRgba(hex,alpha){let h=hex.trim();if(h.startsWith('#'))h=h.slice(1);if(h.length===3){h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]}const r=parseInt(h.slice(0,2),16);const g=parseInt(h.slice(2,4),16);const b=parseInt(h.slice(4,6),16);return'rgba('+r+','+g+','+b+','+alpha+')'}function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function isValidDate(dateStr){const parts=dateStr.split('-');if(parts.length!==3)return false;const y=parseInt(parts[0]),m=parseInt(parts[1])-1,d=parseInt(parts[2]);const dt=new Date(y,m,d);return dt.getFullYear()===y&&dt.getMonth()===m&&dt.getDate()===d}function normalizeDateInput(raw){const s=raw.trim();if(!s)return s;if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;if(/^\d{6}$/.test(s)){const yy=s.slice(0,2),mm=s.slice(2,4),dd=s.slice(4,6);if(parseInt(mm)>=1&&parseInt(mm)<=12&&parseInt(dd)>=1&&parseInt(dd)<=31)return'20'+yy+'-'+mm+'-'+dd;return s}if(/^\d{8}$/.test(s)){const yyyy=s.sli
